<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#06080f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>404 • Halaman Tidak Ditemukan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #06080f;
            --bg-card: rgba(18, 22, 36, 0.75);
            --border-light: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(139, 92, 246, 0.15);
            --primary: #8b5cf6;
            --primary-light: #a78bfa;
            --secondary: #06b6d4;
            --accent: #f472b6;
            --text-main: #f1f3f5;
            --text-muted: #8892a0;
            --font-head: 'Space Grotesk', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --glass-blur: blur(16px);
            --success: #4ade80;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            font-weight: 500;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(139, 92, 246, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(6, 182, 212, 0.03) 0%, transparent 60%),
                linear-gradient(180deg, #06080f 0%, #0c0e1a 50%, #06080f 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.06); border-radius: 10px; }
        * { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.06) transparent; }

        /* ===== NAVBAR TRANSPARAN ===== */
        nav {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1000px;
            padding: 10px 20px;
            background: rgba(10, 12, 20, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .brand {
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            letter-spacing: -0.3px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .brand span { color: var(--primary); }
        .brand i { color: var(--primary); }

        /* ===== NOT FOUND - FULL SCREEN ===== */
        .not_found_body {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 80px 20px 40px;
            position: relative;
        }

        .not_found_container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
        }

        .not_found_main {
            margin: 0 auto;
            width: 100%;
        }

        .not_found_svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ===== OVERLAY - TRANSPARAN DI TENGAH ===== */
        .not_found_overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 520px;
            padding: 20px 24px;
            background: rgba(6, 8, 15, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
            animation: fadeUp 0.8s ease forwards;
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .not_found_overlay .search-wrapper {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 2px 2px 2px 14px;
            transition: all 0.25s ease;
        }

        .not_found_overlay .search-wrapper:hover {
            border-color: rgba(139, 92, 246, 0.15);
        }

        .not_found_overlay .search-wrapper:focus-within {
            border-color: rgba(139, 92, 246, 0.2);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.04);
        }

        .not_found_overlay .search-wrapper .icon {
            color: var(--text-muted);
            opacity: 0.3;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .not_found_overlay .search-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            font-family: inherit;
            outline: none;
            padding: 10px 0;
            min-width: 0;
        }

        .not_found_overlay .search-wrapper input::placeholder {
            color: var(--text-muted);
            opacity: 0.2;
            font-weight: 400;
        }

        .not_found_overlay .search-wrapper .search-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(145deg, #7c3aed, #6d28d9);
            color: #fff;
            font-family: inherit;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .not_found_overlay .search-wrapper .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.25);
        }

        .not_found_overlay .search-wrapper .search-btn:active {
            transform: scale(0.95);
        }

        .not_found_overlay .btn-home {
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            width: 100%;
            justify-content: center;
        }

        .not_found_overlay .btn-home:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .not_found_overlay .btn-home:active {
            transform: scale(0.97);
        }

        .not_found_overlay .btn-home i {
            opacity: 0.5;
        }

        /* ===== SVG THEME ===== */
        .not_found_st0 { fill: rgba(255,255,255,0.02); }
        .not_found_st2 { fill: rgba(139, 92, 246, 0.12); }
        .not_found_st3 { fill: rgba(6, 182, 212, 0.08); }
        .not_found_st4 { fill: rgba(255,255,255,0.015); stroke: rgba(255,255,255,0.04); stroke-miterlimit: 10; }
        .not_found_st6 { fill: rgba(255,255,255,0.015); stroke: rgba(139, 92, 246, 0.15); stroke-width: 2; }
        .not_found_st7, .not_found_st8, .not_found_st9 { stroke: rgba(139, 92, 246, 0.1); stroke-miterlimit: 10; }
        .not_found_st7 { stroke-width: 5; stroke-linecap: round; fill: none; }
        .not_found_st8 { fill: rgba(255,255,255,0.015); }
        .not_found_st9 { fill: none; }
        .not_found_st10 { fill: rgba(255,255,255,0.04); }

        /* ===== ANIMATIONS ===== */
        #not_found_cloud1 { animation: not_found_cloud003 15s linear infinite; }
        #not_found_cloud2 { animation: not_found_cloud002 25s linear infinite; }
        #not_found_cloud3 { animation: not_found_cloud003 20s linear infinite; }
        #not_found_cloud4 { animation: not_found_float 4s linear infinite; }
        #not_found_cloud5 { animation: not_found_float 8s linear infinite; }
        #not_found_tracks { animation: not_found_slide 650ms linear infinite; }
        #not_found_bumps { animation: not_found_land 10000ms linear infinite; }
        #not_found_car-layers { animation: not_found_jig 0.35s linear infinite; }
        #not_found_bracefront, #not_found_braceback { animation: not_found_braces 1s linear infinite; }

        @keyframes not_found_cloud002 {
            0% { transform: translateX(-1000px) translateY(3px); }
            100% { transform: translateX(1000px) translateY(0); }
        }
        @keyframes not_found_cloud003 {
            0% { transform: translateX(-1000px) translateY(3px); }
            100% { transform: translateX(1000px) translateY(0); }
        }
        @keyframes not_found_float {
            0% { transform: translateY(0px) translateX(0); }
            50% { transform: translateY(8px) translateX(5px); }
            100% { transform: translateY(0px) translateX(0); }
        }
        @keyframes not_found_jig {
            0% { transform: translateY(0px); }
            50% { transform: translateY(1px); }
            100% { transform: translateY(0px); }
        }
        @keyframes not_found_land {
            from { transform: translateX(0); }
            to { transform: translateX(1000px); }
        }
        @keyframes not_found_slide {
            from { transform: translateX(0px); }
            to { transform: translateX(100px); }
        }
        @keyframes not_found_braces {
            0% { transform: translateX(-2px); }
            25% { transform: translateX(3px); }
            50% { transform: translateX(-2px); }
            75% { transform: translateX(3px); }
            100% { transform: translateX(-2px); }
        }

        /* ===== TOAST ===== */
        .toast-notif {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(12, 12, 28, 0.95);
            border: 1px solid var(--border-light);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--text-main);
            z-index: 99999;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            font-weight: 600;
            max-width: 90%;
            text-align: center;
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .not_found_body { padding: 70px 12px 30px; }
            .not_found_overlay {
                bottom: 20px;
                padding: 16px 18px;
                max-width: 95%;
            }
            .not_found_overlay .search-wrapper input { font-size: 0.8rem; padding: 8px 0; }
            .not_found_overlay .search-wrapper .search-btn { font-size: 0.6rem; padding: 6px 12px; }
            .not_found_overlay .btn-home { font-size: 0.7rem; padding: 8px 18px; }
            nav { width: 96%; padding: 8px 14px; top: 10px; }
            .brand { font-size: 0.85rem; }
        }

        @media (max-width: 400px) {
            .not_found_body { padding: 60px 8px 20px; }
            .not_found_overlay {
                bottom: 12px;
                padding: 12px 14px;
                gap: 8px;
            }
            .not_found_overlay .search-wrapper { flex-wrap: wrap; padding: 4px; }
            .not_found_overlay .search-wrapper input { min-width: 100%; padding: 8px 12px; }
            .not_found_overlay .search-wrapper .search-btn { width: 100%; justify-content: center; }
            .not_found_overlay .btn-home { font-size: 0.65rem; padding: 8px 14px; }
        }
    </style>
</head>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // SEARCH FUNCTION
            // ============================================================

            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');

            const pages = [
                { name: 'Beranda', url: 'index.html', keywords: ['home', 'utama', 'beranda'] },
                { name: 'Scraper', url: 'scraper.html', keywords: ['scrape', 'scraping', 'download', 'website'] },
                { name: 'Dashboard', url: 'dashboard.html', keywords: ['aktivitas', 'history', 'statistik'] },
                { name: 'IQC Studio', url: 'iqc.html', keywords: ['iqc', 'generate', 'gambar', 'teks'] },
                { name: 'Admin', url: 'admin.html', keywords: ['admin', 'panel', 'settings'] },
                { name: 'Tentang', url: 'about.html', keywords: ['tentang', 'about', 'kami'] },
                { name: 'FAQ', url: 'faq.html', keywords: ['faq', 'pertanyaan', 'tanya'] },
                { name: 'Dokumentasi', url: 'docs.html', keywords: ['dokumentasi', 'docs', 'panduan'] },
                { name: 'Fitur', url: 'features.html', keywords: ['fitur', 'features'] },
                { name: 'Kontak', url: 'contact.html', keywords: ['kontak', 'contact', 'hubungi'] },
                { name: 'Privasi', url: 'privacy.html', keywords: ['privasi', 'privacy', 'data'] },
                { name: 'Syarat', url: 'terms.html', keywords: ['syarat', 'terms', 'ketentuan'] },
                { name: 'Lisensi', url: 'license.html', keywords: ['lisensi', 'license'] },
                { name: 'Cookie', url: 'cookie.html', keywords: ['cookie', 'cookies'] },
            ];

            function searchPage(query) {
                const q = query.toLowerCase().trim();
                if (!q) return null;
                for (const page of pages) {
                    if (page.name.toLowerCase().includes(q)) return page.url;
                    for (const kw of page.keywords) {
                        if (kw.includes(q) || q.includes(kw)) return page.url;
                    }
                }
                return null;
            }

            function handleSearch() {
                const query = searchInput.value.trim();
                if (!query) {
                    searchInput.style.borderColor = '#ef4444';
                    setTimeout(() => { searchInput.style.borderColor = ''; }, 1500);
                    return;
                }
                const result = searchPage(query);
                if (result) {
                    window.location.href = result;
                } else {
                    showToast('🔍 Halaman "' + query + '" tidak ditemukan');
                    searchInput.style.borderColor = '#ef4444';
                    setTimeout(() => { searchInput.style.borderColor = ''; }, 2000);
                }
            }

            searchBtn.addEventListener('click', handleSearch);
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleSearch();
                }
            });

            // ============================================================
            // TOAST
            // ============================================================

            function showToast(msg) {
                const existing = document.querySelector('.toast-notif');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = 'toast-notif';
                toast.textContent = msg;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(-50%) translateY(20px)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            }

            // ============================================================
            // FOCUS
            // ============================================================

            setTimeout(() => {
                searchInput.focus();
            }, 500);

            console.log('🔍 404 Page — Full Screen Animasi!');
            console.log('📍 Path saat ini:', window.location.pathname);
        })();
    </script>
